##### Generelt #####

# Litt bedre terminalstøtte
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# Musestøtte
set -g mouse on

# Kortere escape-forsinkelse
set -sg escape-time 10

# Start vinduer og paneler på 1 i stedet for 0
set -g base-index 1
setw -g pane-base-index 1

# Automatisk renummerering når vinduer lukkes
set -g renumber-windows on


##### Statuslinje #####

# Vis statuslinje
set -g status on
set -g status-position bottom
set -g status-interval 1

# Stil
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Venstre/høyre side
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#89b4fa,bold] #S "
set -g status-right "#[fg=#a6adc8]%Y-%m-%d #[fg=#f9e2af]%H:%M:%S "

# Inaktive vinduer
set -g window-status-format " #[fg=#a6adc8]#I:#W "
set -g window-status-style "bg=#313244,fg=#a6adc8"

# Aktivt vindu
set -g window-status-current-format " #[fg=#1e1e2e,bg=#a6e3a1,bold]#I:#W "
set -g window-status-current-style "bg=#a6e3a1,fg=#1e1e2e,bold"

# Varsel på vinduer med aktivitet
set -g window-status-activity-style "bg=#f9e2af,fg=#1e1e2e,bold"

# Separatorer
set -g status-justify left


##### Paneler #####

# Tydelig kant rundt paneler
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-status top
set -g pane-border-format "PANE #P"

# Vis pane-nummer tydelig når du bruker display-panes
set -g display-panes-time 1200
set -g display-panes-active-colour "#a6e3a1"
set -g display-panes-colour "#9399b2"
set -g pane-border-status top
set -g pane-border-format "#{pane_index} #{pane_current_command}"




##### Titler #####

# Sett terminaltittel så Alacritty/Niri kan vise nyttig info
set -g set-titles on
set -g set-titles-string "#S:#I #W"


##### Oppførsel #####

# Behold vindunavn hvis du setter dem selv
set-option -g allow-rename off

# Lettere splitting: nye paneler åpnes i samme mappe
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Enklere reload av config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf lastet på nytt"


##### Valgfritt: Vim-lignende panelnavigasjon #####

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R